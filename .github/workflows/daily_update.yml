name: Hourly Weather Data Update

on:
  schedule:
    # Runs at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch weather data, update SQL DB, Excel & generate daily/monthly chart pictures
        run: |
          python fetch_weather.py
          python visualize_weather.py

      - name: Commit and push updated dataset, SQL DB, and chart picture archives
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Automated hourly weather ETL update [$(date +'%Y-%m-%d %H:00')]" || echo "No data changes to commit."
          git push
