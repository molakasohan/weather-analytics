name: Daily Weather Data Update

on:
  schedule:
    # Runs daily at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch weather & update visualization dashboard
        run: |
          python fetch_weather.py
          python visualize_weather.py

      - name: Commit and push updated dataset and dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather_data.xlsx data/weather_dashboard.png
          git commit -m "Automated daily weather update [$(date +'%Y-%m-%d')]" || echo "No data changes to commit."
          git push
